name: Build & Auto Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write # WAJIB! Supaya GitHub Actions bisa membuat rilis otomatis beserta upload APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: 'recursive' # Wajib agar semua repo lokal/submodule ikut terunduh
        fetch-depth: '0'

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3.2.0
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '13114758'
        packages: 'platforms;android-36.1 build-tools;36.1.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;28.2.13676358"
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "28.2.13676358"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    # --- BAGIAN 1: COMPILE LIBV2RAY DARI REPO LOKAL ---
    - name: Setup Golang
      uses: actions/setup-go@v6.1.0
      with:
        go-version-file: 'Androidlibxraylitev26.1.23/go.mod'

    - name: Install & Setup Gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: Build libv2ray.aar (Local Repo)
      run: |
        gomobile init
        cd Androidlibxraylitev26.1.23
        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/
        go mod tidy
        mkdir -p ../V2rayNG/app/libs/
        gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid=' -o ../V2rayNG/app/libs/libv2ray.aar ./

    # --- BAGIAN 2: COMPILE LIBHEVTUN ---
    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun to V2rayNG
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    # --- BAGIAN 3: BUILD APK ---
    - name: Decode Keystore
      uses: timheuer/base64-to-file@v1.2.4
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    # --- BAGIAN 4: AUTO RELEASE ---
    - name: Generate Release Tag
      run: |
        if [ -z "${{ github.event.inputs.release_tag }}" ]; then
          TAG="v2.0.${{ github.run_number }}"
        else
          TAG="${{ github.event.inputs.release_tag }}"
        fi
        echo "FINAL_TAG=$TAG" >> $GITHUB_ENV

    - name: Create GitHub Release & Upload APKs
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.FINAL_TAG }}
        name: "V2rayNG Custom Build ${{ env.FINAL_TAG }}"
        body: |
          Rilis otomatis aplikasi V2rayNG hasil racikan full repo lokal Anda sendiri.
          
          **Komponen yang Dikompilasi:**
          - `libv2ray.aar` (Dibuat otomatis dari submodule `Androidlibxraylitev26.1.23`)
          - `libhevtun` (Dibuat otomatis dari submodule `hev-socks5-tunnel`)
        files: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*.apk
