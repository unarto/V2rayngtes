name: Build & Auto Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3.2.0
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '13114758'
        packages: 'platforms;android-36.1 build-tools;36.1.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;28.2.13676358"
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
        # Inject NDK Version ke build.gradle.kts
        sed -i '10i\ndkVersion = "28.2.13676358"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    # --- BAGIAN 1: BUILD LIBV2RAY ---
    - name: Setup Golang
      uses: actions/setup-go@v5
      with:
        go-version-file: 'Androidlibxraylitev26.1.23/go.mod'

    - name: Install Gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: Build libv2ray.aar
      run: |
        cd Androidlibxraylitev26.1.23
        bash gen_assets.sh download
        gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid=' -o ../libv2ray.aar ./
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs/
        cp ../libv2ray.aar ${{ github.workspace }}/V2rayNG/app/libs/

    # --- BAGIAN 2: BUILD LIBHEVTUN ---
    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
        cp -r libs/* ${{ github.workspace }}/V2rayNG/app/libs/
        zip -r hev-socks5-tunnel-libs.zip libs

    # --- BAGIAN 3: BUILD APK (ANTI-LINT VITAL) ---
    - name: Decode Keystore
      uses: timheuer/base64-to-file@v1.2.4
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        
        # Trik mematikan Lint Vital secara permanen untuk build ini
        echo "android.lint.checkReleaseBuilds=false" >> gradle.properties
        echo "android.lint.abortOnError=false" >> gradle.properties
        echo "android.lint.baseline.abortOnError=false" >> gradle.properties
        
        chmod 755 gradlew
        ./gradlew assembleRelease -x lint \
          -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} \
          -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    # --- BAGIAN 4: UPLOAD ARTIFACTS ---
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk
    
    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v4
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v4
      with:
        name: x86
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v4
      with:
        name: x86_64
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86_64*.apk

    # --- BAGIAN 5: AUTO RELEASE ---
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || format('v2.0.{0}', github.run_number) }}
        name: "V2rayNG Custom Build ${{ github.event.inputs.release_tag || format('v2.0.{0}', github.run_number) }}"
        body: |
          Rilis otomatis aplikasi V2rayNG.
          Termasuk dukungan arsitektur: arm64-v8a, armeabi-v7a, x86, dan x86_64.
        files: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*.apk
          hev-socks5-tunnel-libs.zip
